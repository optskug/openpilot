<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Collect CAN Messages</title>
    <style>
      * { box-sizing: border-box; margin: 0; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
        background: #f2f2f7;
        color: #1c1c1e;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .page {
        width: min(100vw, 460px);
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 100vh;
      }

      .back-bar {
        padding: 12px 20px;
      }

      .back-link {
        color: #007aff;
        font-size: 17px;
        text-decoration: none;
        -webkit-tap-highlight-color: transparent;
      }

      .back-link::before {
        content: "‹ ";
      }

      .page-header {
        padding: 0 20px 12px;
      }

      .page-title {
        font-size: 28px;
        font-weight: 700;
      }

      .terminal {
        margin: 0 16px 16px;
        background: #1c1c1e;
        border-radius: 12px;
        padding: 16px;
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        font-family: "SF Mono", ui-monospace, monospace;
        font-size: 13px;
        line-height: 1.6;
        color: #e5e5ea;
        white-space: pre-wrap;
        word-break: break-all;
      }

      .terminal .err { color: #ff453a; }
      .terminal .ok { color: #30d158; }
      .terminal .warn { color: #ff9f0a; }
      .terminal .dim { color: #8e8e93; }
    </style>
  </head>
  <body>
    <main class="page">
      <div class="back-bar">
        <a class="back-link" href="/">TSK Manager</a>
      </div>
      <header class="page-header">
        <div class="page-title">Collect CAN Messages</div>
      </header>
      <div class="terminal" id="terminal"></div>
    </main>

    <script>
      const terminal = document.getElementById("terminal");

      function termWrite(text, className) {
        const span = document.createElement("span");
        if (className) span.className = className;
        span.textContent = text + "\n";
        terminal.appendChild(span);
        terminal.scrollTop = terminal.scrollHeight;
      }

      function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
      }

      async function getStatus() {
        const response = await fetch("/api/can-status", { cache: "no-store" });
        return response.json();
      }

      function progressLine(s) {
        const sec = s.seconds || 0;
        const ratio = Math.min((s.sync_count || 0) / 50, (s.protected_count || 0) / 30);
        const filled = Math.max(0, Math.min(20, Math.round(ratio * 20)));
        const bar = "█".repeat(filled) + "░".repeat(20 - filled);
        return `  [${bar}] ${Math.round(sec)}s   `
          + `sync ${s.sync_count}/50  protected ${s.protected_count}/30`;
      }

      function writeOutcome(s) {
        termWrite("");
        if (s.status === "complete") {
          termWrite("Collection complete.", "ok");
          termWrite(s.message || `sync ${s.sync_count}, protected ${s.protected_count}`, "ok");
        } else if (s.status === "insufficient") {
          termWrite("Not enough CAN messages. Try again.", "err");
        } else {
          termWrite(s.message || "Collection failed.", "err");
        }
      }

      async function runCollect() {
        // Attach to an in-progress collection, or short-circuit a finished one,
        // before starting a fresh capture. Revisiting after complete does not
        // re-collect; revisiting after insufficient/failed retries.
        let s = null;
        try {
          s = await getStatus();
        } catch (err) { /* server not reachable yet, fall through to start */ }

        if (s && s.status === "complete") {
          termWrite("Collection already complete.", "ok");
          termWrite(s.message || `sync ${s.sync_count}, protected ${s.protected_count}`, "ok");
          return;
        }

        if (s && s.status === "running") {
          termWrite("A collection is already in progress — attaching...");
        } else {
          termWrite("Starting CAN message collection.");
          termWrite("Fully start the car with brake + power button.", "dim");
          try {
            const response = await fetch("/api/can-collect", { method: "POST", cache: "no-store" });
            const started = await response.json();
            if (!started.ok && started.status !== "running") {
              termWrite(started.message || "Could not start collection.", "err");
              return;
            }
          } catch (err) {
            termWrite(String(err), "err");
            return;
          }
        }

        termWrite("Collecting sync (0x0F) and protected (0x2E4, 0x131, 0x344) up to 60 seconds.");
        let lastSec = -1;
        while (true) {
          await sleep(500);
          try {
            s = await getStatus();
          } catch (err) {
            continue;  // transient poll failure, keep waiting
          }
          if (s.status === "running") {
            const sec = Math.round(s.seconds || 0);
            if (sec !== lastSec) {
              lastSec = sec;
              termWrite(progressLine(s));
            }
            continue;
          }
          writeOutcome(s);
          break;
        }
      }

      runCollect();
    </script>
  </body>
</html>
